services:
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: nestjs-backend
    image: backend-image
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: angular-frontend
    image: frontend-image
    ports:
      - "4200:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge