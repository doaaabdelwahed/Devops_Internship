apiVersion: v1
kind: Service
metadata:
  name: backend          # must match proxy_pass http://backend:3000 in nginx.conf
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
