apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
  {{- if .Values.kong.enabled }}
  annotations:
    # Kong sends traffic to the Service (ClusterIP), not pod IPs, so the Istio sidecar applies mTLS
    ingress.kubernetes.io/service-upstream: "true"
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
