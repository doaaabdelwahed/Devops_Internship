apiVersion: v1
kind: Service
metadata:
  name: backend          # must match proxy_pass http://backend:3000 in nginx.conf
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
  {{- if .Values.kong.enabled }}
  annotations:
    # Kong sends traffic to the Service (ClusterIP), not pod IPs, so the Istio sidecar applies mTLS
    ingress.kubernetes.io/service-upstream: "true"
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
